<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Inquiry</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #050816;
            color: white;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px;
        }

        /* BACKGROUND GLOW */

        body::before {
            content: "";
            position: fixed;
            width: 500px;
            height: 500px;
            background: #6c00ff;
            filter: blur(150px);
            opacity: 0.5;
            top: -150px;
            left: -150px;
            z-index: -2;
        }

        body::after {
            content: "";
            position: fixed;
            width: 450px;
            height: 450px;
            background: #00eaff;
            filter: blur(150px);
            opacity: 0.35;
            bottom: -150px;
            right: -100px;
            z-index: -2;
        }

        /* FLOATING BALLS */

        .ball {
            position: fixed;
            border-radius: 50%;
            filter: blur(2px);
            animation: float 6s infinite ease-in-out;
            z-index: -1;
        }

        .ball1 {
            width: 80px;
            height: 80px;
            background: #ff00cc;
            top: 15%;
            left: 8%;
        }

        .ball2 {
            width: 60px;
            height: 60px;
            background: #00ffff;
            bottom: 15%;
            left: 15%;
            animation-delay: 2s;
        }

        .ball3 {
            width: 100px;
            height: 100px;
            background: #7000ff;
            top: 20%;
            right: 8%;
            animation-delay: 1s;
        }

        @keyframes float {

            0%,100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-40px);
            }
        }

        /* MAIN CARD */

        .container {
            width: 100%;
            max-width: 1050px;
            padding: 45px;
            border-radius: 30px;

            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(25px);

            border: 1px solid rgba(255,255,255,0.2);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.5),
                inset 0 0 30px rgba(255,255,255,0.05);

            transform: perspective(1200px) rotateX(2deg);
        }

        /* HEADING */

        .heading {
            text-align: center;
            margin-bottom: 40px;
        }

        .heading h1 {
            font-size: 55px;
            letter-spacing: 3px;

            background: linear-gradient(
                90deg,
                #00ffff,
                #8a2be2,
                #ff00cc,
                #00ffff
            );

            background-size: 300%;
            -webkit-background-clip: text;
            color: transparent;

            animation: gradient 5s infinite linear;
        }

        @keyframes gradient {

            0% {
                background-position: 0%;
            }

            100% {
                background-position: 300%;
            }
        }

        .heading p {
            color: #b8b8c9;
            margin-top: 10px;
            font-size: 17px;
        }

        /* FORM */

        .form-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 25px;
        }

        .input-box {
            position: relative;
        }

        .full {
            grid-column: 1 / 3;
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #00ffff;
            font-weight: bold;
            letter-spacing: 1px;
        }

        input,
        select,
        textarea {

            width: 100%;
            padding: 15px 18px;

            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 12px;

            background: rgba(0,0,0,0.3);
            color: white;

            outline: none;
            font-size: 15px;

            transition: 0.3s;
        }

        input:focus,
        select:focus,
        textarea:focus {

            border-color: #00ffff;

            box-shadow:
                0 0 15px rgba(0,255,255,0.4),
                0 0 30px rgba(0,255,255,0.15);

            transform: translateY(-3px);
        }

        select option {
            background: #111;
            color: white;
        }

        textarea {
            height: 140px;
            resize: none;
        }

        /* BUTTON */

        .button-box {
            grid-column: 1 / 3;
            display: flex;
            justify-content: center;
        }

        button {

            width: 260px;
            padding: 16px;

            border: none;
            border-radius: 50px;

            font-size: 17px;
            font-weight: bold;

            color: white;

            cursor: pointer;

            background: linear-gradient(
                90deg,
                #00c6ff,
                #7b2cff,
                #ff00cc
            );

            background-size: 200%;

            box-shadow:
                0 0 20px rgba(0,255,255,0.3);

            transition: 0.4s;
        }

        button:hover {

            transform:
                translateY(-5px)
                scale(1.05);

            background-position: 100%;

            box-shadow:
                0 0 25px #00ffff,
                0 0 50px rgba(255,0,204,0.5);
        }

        /* CONTACT INFORMATION */

        .contact-info {

            margin-top: 45px;
            padding-top: 30px;

            border-top: 1px solid rgba(255,255,255,0.15);

            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 20px;
        }

        .info-card {

            width: 250px;
            padding: 20px;

            text-align: center;

            border-radius: 18px;

            background: rgba(255,255,255,0.06);

            border: 1px solid rgba(255,255,255,0.1);

            transition: 0.4s;

        }

        .info-card:hover {

            transform:
                perspective(500px)
                rotateY(10deg)
                translateY(-8px);

            border-color: #00ffff;

            box-shadow:
                0 0 25px rgba(0,255,255,0.2);
        }

        .icon {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .info-card h3 {
            margin-bottom: 8px;
        }

        .info-card p {
            color: #aaa;
        }

        /* RESPONSIVE */

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .container {
                padding: 25px;
            }

            .heading h1 {
                font-size: 38px;
            }

            .form-box {
                grid-template-columns: 1fr;
            }

            .full,
            .button-box {
                grid-column: 1;
            }

            .contact-info {
                flex-direction: column;
                align-items: center;
            }

        }

    </style>
</head>


<body>

    <!-- FLOATING 3D OBJECTS -->

    <div class="ball ball1"></div>
    <div class="ball ball2"></div>
    <div class="ball ball3"></div>


    <!-- MAIN CONTENT -->

    <div class="container">

        <div class="heading">

            <h1>CONTACT US</h1>

            <p>
                Have a product in mind?
                Let's make something amazing together.
            </p>

        </div>


        <form>

            <div class="form-box">

                <div class="input-box">

                    <label>Full Name</label>

                    <input
                        type="text"
                        placeholder="Enter your name"
                        required>

                </div>


                <div class="input-box">

                    <label>Email</label>

                    <input
                        type="email"
                        placeholder="Enter your email"
                        required>

                </div>


                <div class="input-box">

                    <label>Phone Number</label>

                    <input
                        type="tel"
                        placeholder="Enter phone number">

                </div>


                <div class="input-box">

                    <label>Select Product</label>

                    <select>

                        <option>Select Product</option>

                        <option>Wireless Mouse</option>

                        <option>Keyboard</option>

                        <option>Headphones</option>

                        <option>Gaming Mouse</option>

                        <option>Other</option>

                    </select>

                </div>


                <div class="input-box full">

                    <label>Subject</label>

                    <input
                        type="text"
                        placeholder="What is your inquiry about?">

                </div>


                <div class="input-box full">

                    <label>Your Inquiry</label>

                    <textarea
                        placeholder="Write your product inquiry here..."></textarea>

                </div>


                <div class="button-box">

                    <button type="submit">
                        🚀 SEND INQUIRY
                    </button>

                </div>

            </div>

        </form>


        <!-- CONTACT INFO -->

        <div class="contact-info">

            <div class="info-card">

                <div class="icon">📧</div>

                <h3>Email</h3>

                <p>support@example.com</p>

            </div>


            <div class="info-card">

                <div class="icon">📞</div>

                <h3>Phone</h3>

                <p>+91 98765 43210</p>

            </div>


            <div class="info-card">

                <div class="icon">📍</div>

                <h3>Location</h3>

                <p>Ghaziabad, India</p>

            </div>

        </div>

    </div>

</body>

</html>
